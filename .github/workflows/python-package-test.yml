name: Verify qasm circuits

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install dependencies (no adapt-gym)
      run: |
        uv sync --group dev

    - name: Test with pytest
      run: |
        uv run pytest tests/test_exported_qasm.py
